name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds the frontend, so it has to exist before cargo runs.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quran-reader/desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  screenshots:
    # Arabic rendering per webview engine (DECISIONS.md D-028). Runner images are pinned:
    # a new image (or Playwright version) changes fonts and engines, and then the baselines
    # in apps/desktop/e2e/screenshots/ are regenerated (docs/release.md).
    name: Arabic rendering (${{ matrix.engine }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, engine: wkwebview, browser: webkit }
          - { os: windows-2025, engine: webview2, browser: msedge }
          - { os: ubuntu-24.04, engine: webkitgtk, browser: webkit }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Edge is preinstalled on the Windows runner; WebKit comes with Playwright.
      - if: matrix.browser == 'webkit'
        run: pnpm --filter @quran-reader/desktop exec playwright install --with-deps webkit
      - run: pnpm --filter @quran-reader/desktop test:e2e
        env:
          # Set to `missing` or `all` (repository variable) to write new baselines.
          E2E_UPDATE_SNAPSHOTS: ${{ vars.E2E_UPDATE_SNAPSHOTS }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.engine }}
          path: |
            apps/desktop/e2e/screenshots/${{ matrix.engine }}/
            apps/desktop/e2e/results/
            apps/desktop/e2e/report/
          if-no-files-found: ignore

  data:
    name: Data (xtask verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      # Sources are pinned by SHA-256, so a cached copy is as good as a fresh download and
      # spares tanzil.net. The key changes whenever a pin changes.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: tanzil-${{ hashFiles('data/sources.toml') }}
      - run: cargo xtask fetch
      # 114 surahs, 6,236 verses, Basmala rules, text digest against the source, and a
      # byte-for-byte rebuild of data/quran.bin from the pinned sources.
      - run: cargo xtask verify
