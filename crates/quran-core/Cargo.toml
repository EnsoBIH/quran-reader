[package]
name = "quran-core"
description = "Model, data format, reference parser and search for quran-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quran"
path = "src/bin/quran.rs"

[[bench]]
name = "core"
harness = false

[features]
# The local study store (SQLite) and study export/import. The app enables it; the CLI and
# the data build don't need it.
store = ["dep:rusqlite", "dep:serde_json"]

[dependencies]
serde.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
