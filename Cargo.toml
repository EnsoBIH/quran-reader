[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/EnsoBIH/quran-reader"

[workspace.dependencies]
quran-core = { path = "crates/quran-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Build and test tooling only (xtask, benches, tests); never part of the app.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
roxmltree = "0.21"
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
