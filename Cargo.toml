[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/EnsoBIH/quran-reader"

[workspace.dependencies]
quran-core = { path = "crates/quran-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite for the local study store (DECISIONS.md D-021). `bundled` compiles SQLite in, so
# every platform gets the same version; the default features (statement cache, wasm) are off.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# Build and test tooling only (xtask, benches, tests); never part of the app.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
roxmltree = "0.21"
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
# Opens the few external links the app has (credits, "report a problem") in the browser.
tauri-plugin-opener = "2"
# Updates from GitHub Releases, signed with the project's updater key (DECISIONS.md D-027).
tauri-plugin-updater = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
